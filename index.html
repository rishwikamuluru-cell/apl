<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL ALERT</title>
    <style>
        body { background-color: red; color: white; text-align: center; font-family: Arial, sans-serif; padding-top: 20vh; margin: 0; height: 100vh; }
        h1 { font-size: 2.5rem; }
        button { background-color: black; color: white; font-size: 1.8rem; padding: 20px 40px; border: none; border-radius: 10px; cursor: pointer; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>⚠️ SYSTEM BREACH ⚠️</h1>
    <p>Tap below to clear security lock!</p>
    <button onclick="triggerAlert()">DISMISS</button>
    <audio id="alarm" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" loop></audio>
    <script>
        function triggerAlert() {
            const sound = document.getElementById('alarm');
            sound.play();
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }
    </script>
</body>
</html>
